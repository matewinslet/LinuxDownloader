<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- WinRAR-style archive glyph: three books strapped with a belt (original drawing, WinRAR palette) -->
  <defs>
    <linearGradient id="b1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e98cc0"/><stop offset=".55" stop-color="#c2427f"/><stop offset="1" stop-color="#920159"/></linearGradient>
    <linearGradient id="b2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f8fe0"/><stop offset=".55" stop-color="#00559f"/><stop offset="1" stop-color="#243b9a"/></linearGradient>
    <linearGradient id="b3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2fb27e"/><stop offset=".55" stop-color="#008857"/><stop offset="1" stop-color="#184d00"/></linearGradient>
    <linearGradient id="pg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fffdf5"/><stop offset="1" stop-color="#e9e1c8"/></linearGradient>
    <linearGradient id="belt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4f0000"/><stop offset=".5" stop-color="#7a3a2a"/><stop offset="1" stop-color="#4f0000"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f2f2f2"/><stop offset=".5" stop-color="#a9a9a9"/><stop offset="1" stop-color="#6e6e6e"/></linearGradient>
  </defs>
  <!-- bottom book -->
  <path d="M8 46 h44 l4 -4 v10 l-4 4 h-44 z" fill="url(#b3)" stroke="#0f3300" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M52 46 l4 -4 v10 l-4 4 z" fill="url(#pg)" stroke="#4a3f22" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- middle book -->
  <path d="M10 32 h44 l4 -4 v10 l-4 4 h-44 z" fill="url(#b2)" stroke="#14245e" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M54 32 l4 -4 v10 l-4 4 z" fill="url(#pg)" stroke="#4a3f22" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- top book -->
  <path d="M7 18 h44 l4 -4 v10 l-4 4 h-44 z" fill="url(#b1)" stroke="#5e003a" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M51 18 l4 -4 v10 l-4 4 z" fill="url(#pg)" stroke="#4a3f22" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- top faces -->
  <path d="M7 18 l4 -4 h44 l-4 4 z" fill="url(#pg)" stroke="#4a3f22" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- spine highlights -->
  <g fill="#fff" opacity=".28"><rect x="9" y="19.5" width="40" height="2.2"/><rect x="12" y="33.5" width="40" height="2.2"/><rect x="10" y="47.5" width="40" height="2.2"/></g>
  <!-- belt around the stack -->
  <rect x="26" y="12" width="9" height="46" rx="1.5" fill="url(#belt)" stroke="#2e0000" stroke-width=".8"/>
  <g stroke="#b8796a" stroke-width=".6" stroke-dasharray="1.6 1.4" opacity=".8"><path d="M27.6 13 v44"/><path d="M33.4 13 v44"/></g>
  <!-- buckle -->
  <rect x="23" y="29" width="15" height="12" rx="2" fill="none" stroke="url(#gold)" stroke-width="3"/>
  <rect x="29.5" y="30" width="2" height="10" rx="1" fill="url(#gold)"/>
</svg>
