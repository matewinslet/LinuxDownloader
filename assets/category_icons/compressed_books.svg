<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- WinRAR-style archive glyph: three books strapped with a belt (original drawing) -->
  <defs>
    <linearGradient id="b1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6fae"/><stop offset="1" stop-color="#c2185b"/></linearGradient>
    <linearGradient id="b2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6aa8ff"/><stop offset="1" stop-color="#1e4fb8"/></linearGradient>
    <linearGradient id="b3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b47cff"/><stop offset="1" stop-color="#5b23a8"/></linearGradient>
    <linearGradient id="pg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fffdf5"/><stop offset="1" stop-color="#e9e1c8"/></linearGradient>
    <linearGradient id="belt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7a4a22"/><stop offset=".5" stop-color="#b07436"/><stop offset="1" stop-color="#6b3f1c"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff1a8"/><stop offset=".5" stop-color="#e7b52c"/><stop offset="1" stop-color="#a87412"/></linearGradient>
  </defs>
  <!-- bottom book -->
  <path d="M8 46 h44 l4 -4 v10 l-4 4 h-44 z" fill="url(#b3)" stroke="#3d1475" stroke-width="1"/>
  <path d="M52 46 l4 -4 v10 l-4 4 z" fill="url(#pg)" stroke="#8a7d5a" stroke-width=".6"/>
  <!-- middle book -->
  <path d="M10 32 h44 l4 -4 v10 l-4 4 h-44 z" fill="url(#b2)" stroke="#123478" stroke-width="1"/>
  <path d="M54 32 l4 -4 v10 l-4 4 z" fill="url(#pg)" stroke="#8a7d5a" stroke-width=".6"/>
  <!-- top book -->
  <path d="M7 18 h44 l4 -4 v10 l-4 4 h-44 z" fill="url(#b1)" stroke="#7d0f3c" stroke-width="1"/>
  <path d="M51 18 l4 -4 v10 l-4 4 z" fill="url(#pg)" stroke="#8a7d5a" stroke-width=".6"/>
  <!-- top faces -->
  <path d="M7 18 l4 -4 h44 l-4 4 z" fill="url(#pg)" stroke="#8a7d5a" stroke-width=".6"/>
  <!-- spine highlights -->
  <g fill="#fff" opacity=".28"><rect x="9" y="19.5" width="40" height="2.2"/><rect x="12" y="33.5" width="40" height="2.2"/><rect x="10" y="47.5" width="40" height="2.2"/></g>
  <!-- belt around the stack -->
  <rect x="26" y="12" width="9" height="46" rx="1.5" fill="url(#belt)" stroke="#4a2a10" stroke-width=".8"/>
  <g stroke="#e3b47a" stroke-width=".6" stroke-dasharray="1.6 1.4" opacity=".8"><path d="M27.6 13 v44"/><path d="M33.4 13 v44"/></g>
  <!-- buckle -->
  <rect x="23" y="29" width="15" height="12" rx="2" fill="none" stroke="url(#gold)" stroke-width="3"/>
  <rect x="29.5" y="30" width="2" height="10" rx="1" fill="url(#gold)"/>
</svg>
